<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#0F0F0F"/>

  <!-- W strokes: both arms share the center valley with the X intersection -->
  <polyline
    points="4,6 10,26 16,15 22,26 28,6"
    fill="none"
    stroke="#C9A96E"
    stroke-width="2.8"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- X strokes: centered at 16,16 — arms cross through the W valley -->
  <line x1="9" y1="6"  x2="23" y2="26" stroke="#C9A96E" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>
  <line x1="23" y1="6" x2="9"  y2="26" stroke="#C9A96E" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>

  <!-- Brighten the shared center intersection point -->
  <circle cx="16" cy="16" r="2" fill="#C9A96E" opacity="0.9"/>
</svg>
